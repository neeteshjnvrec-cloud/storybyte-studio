# StoryByte Studio API — deployed by .github/workflows/deploy-api.yml.
# Non-secret settings (GOOGLE_CLIENT_ID, META_APP_ID, PUBLIC_URL) are passed
# with --var at deploy time; secrets are set with `wrangler secret put`.
name = "storybyte-studio-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
