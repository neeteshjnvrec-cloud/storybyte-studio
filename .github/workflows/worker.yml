# Makes and publishes the videos: every hour it queues each active profile's
# due Shorts and episodes, then works through the queue (the dashboard's
# "Run now" adds to the same queue). Setup: docs/SETUP.md.
name: Make videos

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Optional: process only this job (users/<uid>/jobs/<id>)'
        required: false

permissions:
  contents: read

# One run at a time; a run that starts while another is busy waits.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    # Skipped until the project is configured.
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg, fonts and edge-tts
        run: |
          pip install edge-tts
          # fonts-lohit-deva: Devanagari glyphs for Hindi captions.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-lohit-deva fonts-dejavu-core

      - name: Install worker
        working-directory: worker
        run: npm ci

      - name: Make and publish
        working-directory: worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MAX_JOBS_PER_RUN: ${{ vars.MAX_JOBS_PER_RUN || '3' }}
          JOB: ${{ inputs.job }}
        run: |
          if [ -n "$JOB" ]; then node src/run.js --job "$JOB"; else node src/run.js; fi
