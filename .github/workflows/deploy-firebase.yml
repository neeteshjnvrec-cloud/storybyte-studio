# Deploys the dashboard (Firebase Hosting) and the Firestore rules and
# indexes — all on Firebase's free Spark plan. Setup: docs/SETUP.md.
name: Deploy Firebase

on:
  push:
    branches: [main]
    paths: ['web/**', 'firestore.*', 'firebase.json', '.github/workflows/deploy-firebase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-firebase

jobs:
  deploy:
    # Skipped until the project is configured.
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Write the dashboard's config
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          API_URL: ${{ vars.API_URL }}
        shell: bash
        run: |
          missing=""
          for v in FIREBASE_WEB_CONFIG API_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Set these repository variables first (docs/SETUP.md):$missing"; exit 1; fi
          printf 'export const firebaseConfig = %s;\n\nexport const apiUrl = %s;\n' "$FIREBASE_WEB_CONFIG" "$(node -p 'JSON.stringify(process.env.API_URL)')" > web/config.js

      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy --only hosting,firestore --project "$PROJECT" --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
