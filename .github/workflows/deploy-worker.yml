# Builds the video worker and deploys it as a Cloud Run Job that Cloud
# Scheduler starts every hour. (The worker doesn't run on GitHub Actions:
# Actions is for this repo's CI/CD, not for powering a public service.)
# Setup: docs/SETUP.md, step 7.
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-worker

jobs:
  deploy:
    # Skipped until the project is configured (docs/SETUP.md, step 6).
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        shell: bash
        run: |
          missing=""
          for v in PROJECT GOOGLE_CLIENT_ID BUCKET; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            missing=${missing/PROJECT/FIREBASE_PROJECT_ID}
            echo "::error::Set these repository variables first (docs/SETUP.md):${missing/BUCKET/FIREBASE_STORAGE_BUCKET}"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/studio/worker:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit worker --project "$PROJECT" --region "$REGION" --tag "$IMAGE"

      - name: Deploy the Cloud Run Job
        shell: bash
        run: |
          SECRETS="GROQ_API_KEY=GROQ_API_KEY:latest,CLOUDFLARE_ACCOUNT_ID=CLOUDFLARE_ACCOUNT_ID:latest"
          SECRETS="$SECRETS,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest,TOKEN_KEY=TOKEN_KEY:latest"
          SECRETS="$SECRETS,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
          # Optional: the "Premium" voice.
          if gcloud secrets describe SARVAM_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRETS="$SECRETS,SARVAM_API_KEY=SARVAM_API_KEY:latest"
          fi
          gcloud run jobs deploy storybyte-worker --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" \
            --service-account "storybyte-worker@$PROJECT.iam.gserviceaccount.com" \
            --cpu 4 --memory 8Gi --task-timeout 8h --max-retries 0 --tasks 1 \
            --set-env-vars "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID,FIREBASE_STORAGE_BUCKET=$BUCKET,MAX_JOBS_PER_RUN=${{ vars.MAX_JOBS_PER_RUN || '3' }}" \
            --set-secrets "$SECRETS"

      - name: Run it every hour
        shell: bash
        run: |
          URI="https://run.googleapis.com/v2/projects/$PROJECT/locations/$REGION/jobs/storybyte-worker:run"
          verb=create
          gcloud scheduler jobs describe storybyte-worker-hourly --project "$PROJECT" --location "$REGION" >/dev/null 2>&1 && verb=update
          gcloud scheduler jobs "$verb" http storybyte-worker-hourly --project "$PROJECT" --location "$REGION" \
            --schedule "5 * * * *" --time-zone "Etc/UTC" --uri "$URI" --http-method POST \
            --oauth-service-account-email "storybyte-scheduler@$PROJECT.iam.gserviceaccount.com"
